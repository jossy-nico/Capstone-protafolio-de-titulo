spring.application.name=usuario
server.port=8181

spring.datasource.url=jdbc:postgresql://localhost:5432/usuario_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT - NATUR COSECHA
app.jwt.private-key-path=${APP_JWT_PRIVATE_KEY_PATH:C:/natur-cosecha-seguridad/private.pem}
app.jwt.public-key-path=${APP_JWT_PUBLIC_KEY_PATH:C:/natur-cosecha-seguridad/public.pem}
