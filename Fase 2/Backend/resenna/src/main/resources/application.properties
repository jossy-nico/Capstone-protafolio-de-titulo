spring.application.name=resenna

server.port=8484

spring.datasource.url=jdbc:postgresql://localhost:5432/resenna_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# URLs configurables para llamadas entre microservicios
usuario.api.base-url=http://localhost:8181/api/usuarios
venta.api.base-url=http://localhost:8383/api/ventas
