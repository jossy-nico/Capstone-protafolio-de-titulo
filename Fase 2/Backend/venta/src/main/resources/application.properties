spring.application.name=venta

server.port=8383

spring.datasource.url=jdbc:postgresql://localhost:5432/venta_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#http producto
producto.api.base-url=http://localhost:8080
usuario.api.base-url=http://localhost:8181


# ==========================================
# JWT - NATUR COSECHA
# ==========================================

# Solo clave publica: venta-api NO firma tokens.
app.jwt.public-key-path=C:/natur-cosecha-seguridad/public.pem

# Emisor configurado en usuario-api
app.jwt.issuer=natur-cosecha-usuario-api

# Destinatario configurado en JwtService
app.jwt.audience=natur-cosecha-api
