name: Docker stack validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - actualizacion-capstone-webpay-pdf

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create non-secret validation environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_IMAGE=postgres:17-alpine
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci-only-not-a-secret
          POSTGRES_VOLUME_NAME=ci-postgres-volume
          CLOUDINARY_CLOUD_NAME=ci-placeholder
          CLOUDINARY_API_KEY=ci-placeholder
          CLOUDINARY_API_SECRET=ci-placeholder
          WEBPAY_API_KEY=ci-placeholder
          EOF
          mkdir -p secrets/jwt
          touch secrets/jwt/private.pem secrets/jwt/public.pem
      - name: Validate Compose interpolation and merged configuration
        run: docker compose config --quiet
      - name: Validate database initializer shell syntax
        run: sh -n docker/postgres/init/10-create-databases.sh
      - name: Build all five microservice images
        run: docker compose build --pull

  compile-services:
    name: Compile ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: producto
            path: "producto"
          - service: usuario
            path: "usuario"
          - service: carrito
            path: "carrito_compra"
          - service: venta
            path: "venta"
          - service: resenas
            path: "resenna"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile main and test sources with module Gradle Wrapper
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon compileJava compileTestJava


  android-build:
    name: Android APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android with Docker
        run: |
          docker build \
            -f frutos-android/Dockerfile.android \
            -t natur-cosecha-android-builder:ci \
            frutos-android

      - name: Extract APK
        run: |
          mkdir -p artifacts
          container=$(docker create natur-cosecha-android-builder:ci)
          docker cp "$container:/workspace/app/build/outputs/apk/debug/app-debug.apk" artifacts/app-debug.apk
          docker rm "$container"
          test -s artifacts/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: natur-cosecha-android-debug
          path: artifacts/app-debug.apk
          retention-days: 7
