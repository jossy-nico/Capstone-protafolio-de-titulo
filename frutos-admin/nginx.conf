server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/categorias {
        proxy_pass http://productos:8080;
    }

    location /api/productos {
        proxy_pass http://productos:8080;
    }

    location /api/usuarios {
        proxy_pass http://usuarios:8181;
    }

    location /api/clientes {
        proxy_pass http://usuarios:8181;
    }

    location /api/empleados {
        proxy_pass http://usuarios:8181;
    }

    location /api/favoritos {
        proxy_pass http://usuarios:8181;
    }

    location /api/carrito {
        proxy_pass http://carrito:8282;
    }

    location /api/ventas {
        proxy_pass http://ventas:8383;
    }

    location /api/detalle-ventas {
        proxy_pass http://ventas:8383;
    }

    location /api/webpay {
        proxy_pass http://ventas:8383;
    }

    location /api/resennas {
        proxy_pass http://resenas:8484;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
